<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="Browse The Little Cookbook, an illustrated collection of recipes with step-by-step methods.">
  <title>The Little Cookbook</title>
  <link rel="stylesheet" href="assets/cookbook.css">
  <link rel="stylesheet" href="assets/catalogue.css">
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="src/catalogue-page.js"></script>
</head>
<body>
  <a class="skip-link" href="#recipes" data-copy="skip">Skip to the recipe index</a>
  <header class="site-header">
    <div class="site-bar catalogue-site-bar wrap">
      <a class="brand" id="catalogue-home" href="./" aria-current="page">
        <svg class="brand-icon" aria-hidden="true"><use href="assets/illustrations/icons.svg#brand"></use></svg>
        <span data-copy="brand">The Little Cookbook</span>
      </a>
      <a class="site-nav-link" href="#recipes" data-copy="index">Recipe index</a>
      <nav class="language-switch" aria-label="Language">
        <a id="language-en" href="./" lang="en" hreflang="en" aria-current="page">English</a>
        <a id="language-fr" href="./?lang=fr" lang="fr" hreflang="fr">Français</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <header class="catalogue-hero">
      <div class="catalogue-hero-copy">
        <h1><span data-copy="heroStart">The Little</span><br class="catalogue-title-break"><span data-copy="heroEnd"> Cookbook</span></h1>
        <p data-copy="intro">Find your next recipe and keep your place as you cook.</p>
        <a class="button jump-button" href="#recipes" data-copy="browse">Browse recipes</a>
      </div>
      <img class="catalogue-art" src="assets/illustrations/cookbook.svg" alt="" width="540" height="350">
    </header>

    <section class="recipe-section catalogue-section" id="recipes" aria-labelledby="catalogue-title" tabindex="-1">
      <h2 id="catalogue-title" data-copy="index">Recipe index</h2>
      <div class="catalogue-tools panel" id="catalogue-tools" hidden>
        <div class="catalogue-search">
          <label class="visually-hidden" for="recipe-search" data-copy="searchLabel">Search by recipe or ingredient</label>
          <svg class="icon catalogue-search-icon" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.8"/>
            <path d="m15 15 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input class="text-input" type="search" id="recipe-search" placeholder="Recipe or ingredient">
        </div>
        <div class="catalogue-filters" id="catalogue-filters" role="group" aria-label="Filter by category"></div>
      </div>
      <p class="catalogue-results" id="catalogue-results" role="status" aria-atomic="true"></p>
      <noscript>
        <p class="notice">Enable JavaScript to browse the recipe index.</p>
        <p class="notice" lang="fr">Activez JavaScript pour consulter le répertoire des recettes.</p>
      </noscript>
      <div id="catalogue-groups"></div>
      <div class="catalogue-empty panel" id="catalogue-empty" hidden>
        <p data-copy="emptyHelp">Try another ingredient or clear the filters to see all recipes.</p>
        <button class="button" type="button" id="reset-catalogue" data-copy="clear">Clear filters</button>
      </div>
    </section>
  </main>

  <template id="recipe-card-template">
    <li class="catalogue-card panel">
      <a class="catalogue-card-link">
        <div class="catalogue-card-media">
          <img class="catalogue-card-image" alt="" width="640" height="480" loading="lazy" hidden>
          <svg class="catalogue-card-art" aria-hidden="true"><use href="assets/illustrations/icons.svg#art-saucepan"></use></svg>
        </div>
        <div class="catalogue-card-copy">
          <p class="catalogue-card-qualifier"></p>
          <h4 class="catalogue-card-title"></h4>
          <p class="catalogue-card-description"></p>
        </div>
      </a>
    </li>
  </template>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p data-copy="brand">The Little Cookbook</p>
      <a class="back-link" href="#recipes" data-copy="index">Recipe index</a>
    </div>
  </footer>
</body>
</html>
