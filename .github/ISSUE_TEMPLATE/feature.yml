name: Feature request
description: Propose new functionality
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would this feature do, roughly?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about and why this one's better.
    validations:
      required: false
